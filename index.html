	}

.leaflet-tooltip-bottom {

}
.leaflet-tooltip-top {

html,body{margin:0}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px)}

/* Layout: map-first home (search + locate + 50m radius, gift labels on pins), station-style detail page per pop-up.
   Phone: full-bleed map, search on top, nearby sheet at bottom. Wide: left panel (search + nearby), map on the right. */
:root{
  --bg:#ffffff; --panel:#f4f7f5; --surface:#ffffff; --ink:#1c201e; --muted:#77807b; --faint:#a9b1ac; --line:#e3e9e5;
  --green:#2ea84a; --green-deep:#1d7d35; --green-soft:#e6f5ea; --green-ink:#ffffff;
  --red:#e2412e; --amber:#c47a00; --amber-soft:#fff3dc; --sub:#e8b500;
  --gold:#a8750f; --gold-soft:#fff4dc; --vip:#d9a53a; --vip-ink:#2a2216;
  --m-bg:#eef2ef; --m-block:#e4eae6; --m-road:#ffffff; --m-road2:#f7f9f8; --m-park:#cfe6d2; --m-river:#cde2f0; --m-text:#8b958f;
  --shadow:0 2px 10px rgba(20,40,28,.12);
  --f-ui:"Pretendard","PingFang SC","Hiragino Sans GB","Noto Sans SC","Noto Sans CJK SC","Apple SD Gothic Neo","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"Archivo","PingFang SC","Noto Sans SC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111513; --panel:#171c19; --surface:#1b211e; --ink:#eef3f0; --muted:#9aa49f; --faint:#69736e; --line:#2a322e;
  --green:#3cc25a; --green-deep:#6fd987; --green-soft:#183324; --green-ink:#0e1a12;
  --red:#ff6b57; --amber:#f0b04a; --amber-soft:#33291a; --sub:#f0c43a;
  --gold:#e4bd62; --gold-soft:#31291a; --vip:#e2b656; --vip-ink:#221b12;
  --m-bg:#171d1a; --m-block:#1d2420; --m-road:#2c3530; --m-road2:#252d29; --m-park:#1e3324; --m-river:#182a37; --m-text:#7d8883;
  --shadow:0 2px 10px rgba(0,0,0,.45); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111513; --panel:#171c19; --surface:#1b211e; --ink:#eef3f0; --muted:#9aa49f; --faint:#69736e; --line:#2a322e;
  --green:#3cc25a; --green-deep:#6fd987; --green-soft:#183324; --green-ink:#0e1a12;
  --red:#ff6b57; --amber:#f0b04a; --amber-soft:#33291a; --sub:#f0c43a;
  --gold:#e4bd62; --gold-soft:#31291a; --vip:#e2b656; --vip-ink:#221b12;
  --m-bg:#171d1a; --m-block:#1d2420; --m-road:#2c3530; --m-road2:#252d29; --m-park:#1e3324; --m-river:#182a37; --m-text:#7d8883;
  --shadow:0 2px 10px rgba(0,0,0,.45); color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.pad{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .in{height:52px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}
.badge{width:26px;height:26px;border-radius:50%;background:var(--green);color:var(--green-ink);display:grid;place-items:center;font-family:var(--f-num);font-weight:800;font-size:14px;flex:none}
.proto{margin-left:auto;font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:12px;padding:2px 9px;white-space:nowrap}

/* ---------- HOME ---------- */
.home{position:relative;height:calc(100vh - 52px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - 52px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:520px;overflow:hidden}
.mapwrap{position:absolute;inset:0;background:var(--m-bg)}
.topov{position:absolute;left:0;right:0;top:0;z-index:5;padding-top:12px}
.search{display:flex;align-items:center;gap:10px;height:50px;border-radius:25px;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line);padding:0 8px 0 16px;position:relative}

 food:'<svg viewBox="0 0 24 24"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2 0-4 2-4 6v4h4"/></svg>',
 sweet:'<svg viewBox="0 0 24 24"><path d="M4 13h16l-2 7H6zM6 13c0-4 2.7-7 6-7s6 3 6 7M12 6V3"/></svg>',
 ref:'<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>',
 door:'<svg viewBox="0 0 24 24"><path d="M6 21V4h12v17M3 21h18"/><circle cx="14.5" cy="12.5" r="1"/></svg>',
 clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>',
 link:'<svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
 copy:'<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>'
};
let tt; function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2600);}

/* ---------- MAP ---------- */
const homeEl=document.getElementById('home'), detEl=document.getElementById('detail');
const wide=()=>matchMedia('(min-width:880px)').matches;
const dark=()=>document.documentElement.dataset.theme==='dark'||(document.documentElement.dataset.theme!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);
const map=L.map('map',{zoomControl:false,zoomSnap:.5,minZoom:14,maxZoom:19,maxBounds:[[37.530,127.025],[37.556,127.075]],maxBoundsViscosity:.8}).setView(FALLBACK,17);
let tileFail=0;
L.tileLayer(`https://{s}.basemaps.cartocdn.com/${dark()?'dark_all':'light_all'}/{z}/{x}/{y}{r}.png`,{subdomains:'abcd',maxZoom:20,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a>'})
 .on('tileerror',()=>{if(++tileFail===3)document.getElementById('tilewarn').hidden=false;}).on('tileload',()=>{document.getElementById('tilewarn').hidden=true;tileFail=-99;}).addTo(map);
L.control.zoom({position:'bottomright'}).addTo(map);
map.attributionControl.setPrefix(false);
const ring=L.circle(S.me,{radius:50,color:'#2ea84a',weight:2,dashArray:'6 5',fillColor:'#2ea84a',fillOpacity:.08,interactive:false}).addTo(map);
const meDot=L.marker(S.me,{icon:L.divIcon({className:'me-wrap',html:'<span class="me-pulse"></span><span class="me-dot"></span>',iconSize:[30,30],iconAnchor:[15,15]}),interactive:false,zIndexOffset:1000}).addTo(map);
L.marker(SEONGSU_ST,{icon:L.divIcon({className:'stn-wrap',html:'<span class="stn"><b>2</b>圣水站</span>',iconSize:[74,24],iconAnchor:[37,12]}),interactive:false}).addTo(map);
L.marker([37.54360,127.04460],{icon:L.divIcon({className:'stn-wrap',html:'<span class="stn y"><b>水</b>首尔林站</span>',iconSize:[84,24],iconAnchor:[42,12]}),interactive:false}).addTo(map);
const layer=L.layerGroup().addTo(map);
function giftIcon(p,near){return L.divIcon({className:'gm-wrap',html:`<div class="gm${near?' on':''} t-${p.type}"><div class="bub">${ICON[p.type]}<span>${esc(p.g)}</span></div><i></i><em>${esc(p.brand)}</em></div>`,iconSize:[64,86],iconAnchor:[32,68]});}
function drawMarkers(){layer.clearLayers();visible().forEach(p=>{const near=distM(p)<=50;
  L.marker(p.ll,{icon:giftIcon(p,near),title:p.zh+' · '+p.g,riseOnHover:true,zIndexOffset:near?500:0}).on('click',()=>openPop(p.id)).addTo(layer);});}
function setMe(ll,recenter){S.me=ll;ring.setLatLng(ll);meDot.setLatLng(ll);drawMarkers();renderNear();if(recenter)centerMe();}
function centerMe(){const z=Math.max(map.getZoom(),17);let off=0;if(!wide()){const sh=document.getElementById('near').offsetHeight,tp=document.querySelector('.topov').offsetHeight;off=(sh-tp)/2;}
  map.setView(map.unproject(map.project(S.me,z).add([0,off]),z),z,{animate:true});}
map.on('click',e=>{setMe([e.latlng.lat,e.latlng.lng],false);toast('已把你的位置移到这里（演示）');});

/* ---------- HOME ---------- */
function nearList(){
  const vs=visible().map(p=>({p,d:distM(p)})).sort((a,b)=>a.d-b.d);
  const inR=vs.filter(x=>x.d<=50);
  const cards=inR.map(({p,d})=>`<button class="nc" data-act="open" data-id="${p.id}">
    <div class="t"><b>${esc(p.zh)}</b><span class="c">${p.cat}</span><span class="dm">${d}m</span></div>
    <div class="gifts">${p.perks.map(x=>`<span class="gift${/折扣|新品|售卖|菜单|提示|便利/.test(x[1])?' a':''}">${ICON[/food|sweet/.test(p.type)?p.type:'gift']}${esc(x[0])}</span>`).join('')}</div>
    <div class="ft"><span>${ENTRY[p.entry]}${p.start==='常设'?' · '+esc(p.hours.split('·')[0]):` · 剩 <b data-end="${p.endTs}">${left(p.endTs)}</b>`}</span><span class="more">详情 ›</span></div></button>`).join('');
  const nearest=vs[0];
  const empty=`<div class="emptyn">50m 内暂时没有快闪和美食${nearest?`<button data-act="open" data-id="${nearest.p.id}">最近的是 ${esc(nearest.p.zh)} · ${fmtD(nearest.d)} ›</button>`:''}</div>`;
  return `<div class="grab"></div><div class="sh pad"><h2>附近 50m · <em>${inR.length}</em> 家</h2><small>${S.real?'当前定位':'演示位置'} · 点地图可移动</small></div>
   <div class="near pad">${inR.length?cards:empty}<p class="datanote">共收录圣水 ${live.filter(p=>!/food|sweet/.test(p.type)).length} 家快闪、${live.filter(p=>/food|sweet/.test(p.type)).length} 家餐厅甜品 · 信息查询于 ${DATA_DATE}，以官方为准 · 店铺位置为估算</p></div>`;}
function renderNear(){document.getElementById('near').innerHTML=nearList();}
function results(){
  const q=S.q.trim().toLowerCase(); if(!q)return '';
  const hit=live.filter(p=>(p.name+p.zh+p.brand+p.cat+p.addr+p.g+p.perks.map(x=>x[0]).join('')).toLowerCase().includes(q));
  const hl=s=>{const i=s.toLowerCase().indexOf(q);return i<0?esc(s):esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length));};
  return `<div class="results" role="listbox">${hit.length?hit.map(p=>`<button class="res" data-act="open" data-id="${p.id}"><span class="pi">${ICON.pin}</span><span><b>${hl(p.zh)}</b><small>${p.cat} · ${esc(p.g)} · ${p.start==='常设'?'常设':p.start+'–'+p.endTxt}</small></span><span class="d">${fmtD(distM(p))}</span></button>`).join('')
    :`<div class="res" style="color:var(--muted)">圣水暂时没有找到「${esc(S.q)}」</div>`}</div>`;}
function renderChips(){document.getElementById('chips').innerHTML=['全部',...CATS].map(c=>{const lock=c!=='全部'&&!S.member;return `<button class="fl${S.cat===c?' on':''}" data-act="cat" data-v="${c}">${c}${lock?'<span class="vip">VIP</span>':''}</button>`}).join('');}
const qEl=document.getElementById('q');
qEl.addEventListener('input',()=>{S.q=qEl.value;document.getElementById('res').innerHTML=results();document.getElementById('clr').hidden=!S.q;});
function locate(){
  if(!navigator.geolocation){toast('这个浏览器不支持定位，已使用圣水演示位置');setMe(FALLBACK,true);return;}
  toast('正在定位…');
  navigator.geolocation.getCurrentPosition(pos=>{const ll=[pos.coords.latitude,pos.coords.longitude];
    if(meters(ll,SEONGSU_ST)>2500){S.real=false;toast('你现在不在圣水附近，先用圣水演示位置');setMe(FALLBACK,true);}
    else{S.real=true;toast('已定位到你的位置');setMe(ll,true);}},
   ()=>{S.real=false;toast('没有拿到定位权限，已使用圣水演示位置');setMe(FALLBACK,true);},{enableHighAccuracy:true,timeout:8000});}

/* ---------- DETAIL ---------- */
function head(p){
  return `<div class="backrow pad"><button data-act="home">${ICON.back}返回地图</button></div>
   <section class="head pad">
   <div style="display:flex;align-items:flex-start;gap:8px"><div style="flex:1;min-width:0">
    <div class="title"><h1>${esc(p.zh)}</h1><span class="cat">${p.cat}</span></div>
    <div class="addr ko-name">${esc(p.name)}</div>
    <div class="addr">${p.start==='常设'?'常设店铺':p.start+' – '+p.endTxt} · 距你约 ${fmtD(distM(p))}</div></div>
    <button class="star${S.fav[p.id]?' on':''}" data-act="fav" aria-label="收藏">${ICON.star}</button></div>
   <div class="chiprow"><a class="chipb p" href="${naver(p)}" target="_blank" rel="noopener">${ICON.pin}Naver 地图导航</a>
    ${p.entry==='naver'?`<a class="chipb s" href="${p.src}" target="_blank" rel="noopener">${ICON.cal}查看预约方式</a>`:''}
    <button class="chipb" data-act="perks">${ICON.gift}福利</button><a class="chipb" href="${p.src}" target="_blank" rel="noopener">${ICON.link}信息来源</a></div>
  </section><div class="sep"></div>`;}
function lineBar(){const prev=LINE[S.i-1],next=LINE[S.i+1],p=P();
  return `<div class="lineb" role="group" aria-label="切换快闪">
   <button class="side" data-act="step" data-v="-1" ${prev?'':'disabled'}>‹ <span>${prev?esc(prev.brand):'首尔林站'}</span></button>
   <div class="cur"><span class="badge">${S.i+1}</span><b>${esc(p.brand)}</b></div>
   <button class="side r" data-act="step" data-v="1" ${next?'':'disabled'}><span>${next?esc(next.brand):'圣水站'}</span> ›</button></div>`;}
function cards(p){
  if(S.mode==='live'){
    const q=p.rep?`<div class="kv"><span>现场情况</span><b class="${p.rep==='人少'?'g':p.rep==='一般'?'a':''}">${p.rep}</b></div><div class="src">刚刚由你上报 · 正式版会汇总所有用户的上报</div>`
      :`<div class="kv"><span>排队时长</span><b class="k">暂无上报</b></div><div class="rep2">我在现场：${['人少','一般','很多'].map(x=>`<button data-act="report" data-v="${x}">${x}</button>`).join('')}</div>`;
    return `<div class="cards">
     <div class="card"><h3>现场排队</h3>${q}</div>
     <div class="card"><h3>入场方式</h3><div class="kv"><span>方式</span><b class="${p.entry==='walkin'?'g':'a'}">${ENTRY[p.entry]}</b></div>${p.start==='常设'?'':`<div class="kv"><span>距结束</span><b data-end="${p.endTs}">${left(p.endTs)}</b></div>`}${p.entryNote?`<div class="src">${esc(p.entryNote)}</div>`:''}</div></div>`;}
  return `<div class="cards">
    <div class="card"><h3>营业时间</h3><div class="kv"><span style="white-space:normal">${esc(p.hours)}</span></div></div>
    <div class="card"><h3>${p.start==='常设'?'店铺类型':'快闪期间'}</h3>${p.start==='常设'?'<div class="kv"><span>常设店铺</span></div>':`<div class="kv"><span>日期</span><b class="k">${p.start}–${p.endTxt}</b></div><div class="kv"><span>剩余</span><b data-end="${p.endTs}">${left(p.endTs)}</b></div>`}</div></div>`;}
function lineMap(){
  const st=LINE.map((p,i)=>`<button class="st${i===S.i?' cur':''}" data-act="go" data-v="${i}" aria-label="${esc(p.zh)}"><span class="dot"></span><span class="nm">${esc(p.brand)}</span><span class="q">${esc(p.g)}</span></button>`).join('');
  return `<div class="mapbox"><div class="mapscroll"><div class="track">
    <div class="st term"><span class="sub subs">水仁·盆唐线</span><span class="dot"></span><span class="nm">首尔林站</span></div>${st}
    <div class="st term"><span class="sub sub2">2号线</span><span class="dot"></span><span class="nm">圣水站</span></div></div></div></div>`;}
function guide(p){
  if(p.entry==='naver')return `<ol class="guide"><li>打开"信息来源"页面，找到 <span class="ko">네이버 예약</span> 链接</li><li>用 Naver 账号登录，选择日期和时段完成预约</li><li>按预约时间到店，出示预约确认页面入场</li></ol>`;
  if(p.entry==='ticket')return `<ol class="guide"><li>这是收费展览，需要购票入场</li><li>票价和预约方式请看"信息来源"页面里的官方链接</li><li>周末人多，建议工作日或开门时段去</li></ol>`;
  return `<ol class="guide"><li>不用预约，直接到门口排队</li><li>人多时店员可能会让你登记手机号排号，留意短信或 KakaoTalk 通知</li><li>周末下午最挤，工作日或开门后一小时内去最省时间</li></ol>`;}
function info(p){
  return `<section class="sec pad" id="perks"><h2>${/food|sweet/.test(p.type)?'招牌与价格':'福利与亮点'}</h2><div>${p.perks.map(x=>`<div class="perk">${esc(x[0])}<span class="tag ${/赠品|周边|限定|招牌/.test(x[1])?'t-g':'t-a'}">${x[1]}</span></div>`).join('')}</div>
    <p class="datanote">以上整理自 <a href="${p.src}" target="_blank" rel="noopener">${p.src.includes('popply')?'Popply 活动页':'来源页面'}</a>（查询于 ${DATA_DATE}），以官方公告为准</p></section><div class="sep"></div>
   <section class="sec pad"><h2>快闪信息</h2><div class="facts">
    <div class="fact"><span class="ic">${ICON.door}</span><div>入场方式<small><span class="hl">${ENTRY[p.entry]}</span></small></div></div>
    <div class="fact"><span class="ic">${ICON.clock}</span><div>营业时间<small>${esc(p.hours)}</small></div></div>
    <div class="fact"><span class="ic">${ICON.cal}</span><div>${p.start==='常设'?'类型':'快闪期间'}<small>${p.start==='常设'?'常设店铺':p.start+' – '+p.endTxt}</small></div></div>
    <div class="fact"><span class="ic">${ICON.pin}</span><div>韩文地址<small>${esc(p.addr)}</small><button class="copy" data-act="copy" data-v="${esc(p.addr)}">${ICON.copy}复制，给出租车司机看</button></div></div>
   </div></section><div class="sep"></div>
   <section class="sec pad"><h2>怎么入场<small>中文指引</small></h2>${guide(p)}</section>`;}
function vDetail(){const p=P();
  return `<div class="wrap grid"><main>${head(p)}<section class="pad" style="padding-bottom:22px">${lineBar()}
   <div class="rt"><div class="seg"><button class="${S.mode==='live'?'on':''}" data-act="mode" data-v="live">现场</button><button class="${S.mode==='info'?'on':''}" data-act="mode" data-v="info">营业</button></div>
   <span class="clock">${clock(S.clock)}</span><button class="refresh" data-act="refresh" aria-label="刷新">${ICON.ref}</button></div>${cards(p)}</section>
   <div class="sep"></div>${info(p)}</main>
   <aside class="aside"><section class="sec pad"><h2>圣水线路图<small>从首尔林到圣水站 · 点站点切换</small></h2>${lineMap()}</section>
   <p class="foot pad">课堂作业「快闪雷达」原型。快闪信息整理自 Popply（${DATA_DATE}），以官方公告为准；地图上的店铺位置按地址估算，导航请以 Naver 地图为准。排队上报为演示功能。</p></aside></div>`;}
function vSheet(){
  const why={filter:'分类筛选是会员功能'}[S.sheet]||'';const pl=PLANS.find(x=>x.k===S.sel);
  return `<div class="mask" data-act="close"><div class="vsheet" role="dialog" aria-label="会员">
   <div class="shead pad"><h3>逛圣水，一场都不错过</h3><p>按喜好筛选，新快闪和快结束的快闪第一时间提醒你</p>${why?`<span class="why">${why}</span>`:''}<button class="x" data-act="close" aria-label="关闭">×</button></div>
   <div class="pad"><div class="plans">${PLANS.map(x=>`<button class="plan${S.sel===x.k?' on':''}" data-act="plan" data-v="${x.k}"><div>${x.nm}</div><div class="pr"><small>¥</small>${x.pr}</div><div class="ds">${x.ds}</div></button>`).join('')}</div>
    <table class="tbl"><tr><th>功能</th><th>免费</th><th>会员</th></tr>
     <tr><td>地图 · 搜索 · 50m 内福利</td><td class="y">✓</td><td class="y">✓</td></tr>
     <tr><td>单店详情 · 导航 · 中文入场指引</td><td class="y">✓</td><td class="y">✓</td></tr>
     <tr><td>分类筛选（餐厅/甜品/美妆/服装/运动/联名/K-pop）</td><td>—</td><td class="y">✓</td></tr>
     <tr><td>新快闪 / 即将结束提醒</td><td>—</td><td class="y">✓</td></tr></table>
    <button class="buy" data-act="buy">开通${pl.nm} ¥${pl.pr}（演示，不扣费）</button><div class="fine">定价为示意，正式价格待验证后确定</div></div></div></div>`;}

function renderDetail(){detEl.innerHTML=vDetail();const c=document.querySelector('.st.cur');if(c){const sc=c.closest('.mapscroll');sc.scrollLeft=c.offsetLeft-sc.clientWidth/2+46;}}
function renderSheet(){document.getElementById('sheetHost').innerHTML=S.sheet!==null?vSheet():'';}
function rerender(){if(S.view==='detail'){const y=scrollY;renderDetail();scrollTo(0,y);}renderSheet();}
function openPop(id){S.i=LINE.findIndex(x=>x.id===id);if(S.i<0)return;S.view='detail';S.mode='live';S.sheet=null;renderSheet();homeEl.hidden=true;detEl.hidden=false;renderDetail();scrollTo(0,0);try{history.replaceState(null,'','#'+id);}catch(e){}}
function goHome(){S.view='home';detEl.hidden=true;detEl.innerHTML='';homeEl.hidden=false;map.invalidateSize();drawMarkers();renderNear();try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el)return;
  const a=el.dataset.act, v=el.dataset.v, p=P();
  if(a==='open')openPop(el.dataset.id);
  else if(a==='home')goHome();
  else if(a==='locate')locate();
  else if(a==='clear'){S.q='';qEl.value='';document.getElementById('res').innerHTML='';el.hidden=true;}
  else if(a==='step'){const n=LINE[S.i+(+v)];if(n)openPop(n.id);}
  else if(a==='go')openPop(LINE[+v].id);
  else if(a==='mode'){S.mode=v;rerender();}
  else if(a==='refresh'){S.clock=Date.now();rerender();toast('已刷新');}
  else if(a==='report'){p.rep=v;rerender();toast('感谢上报（演示）');}
  else if(a==='perks'){const t=document.getElementById('perks');if(t)t.scrollIntoView({behavior:'smooth'});}
  else if(a==='copy'){const t=v;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('韩文地址已复制'),()=>toast('请长按地址手动复制'));}
  else if(a==='fav'){S.fav[p.id]=!S.fav[p.id];rerender();toast(S.fav[p.id]?'已收藏':'已取消收藏');}
  else if(a==='cat'){if(v!=='全部'&&!S.member){S.sheet='filter';renderSheet();}else{S.cat=v;renderChips();drawMarkers();renderNear();}}
  else if(a==='close'){if(e.target===el||el.classList.contains('x')){S.sheet=null;renderSheet();}}
  else if(a==='plan'){S.sel=v;renderSheet();}
  else if(a==='buy'){S.member=true;S.sheet=null;renderSheet();renderChips();toast('已开通（演示）：分类筛选已解锁');}
});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(LINE.some(x=>x.id===id))openPop(id);});
setInterval(()=>{document.querySelectorAll('[data-end]').forEach(el=>{el.textContent=left(+el.dataset.end);});},30000);
renderChips();drawMarkers();renderNear();
setTimeout(()=>{map.invalidateSize();centerMe();},60);
const h0=location.hash.slice(1); if(LINE.some(x=>x.id===h0))openPop(h0);
})();

</script>
</body></html>
